[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "parshred"
version = "0.1.0"
description = "High-performance SIMD-accelerated XML parser"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [{name = "Parshred Contributors"}]
keywords = ["xml", "parser", "simd", "dom", "sax", "xpath", "fast", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: XML",
]

[project.urls]
Homepage = "https://github.com/gregghy/parshred"
Repository = "https://github.com/gregghy/parshred"
Documentation = "https://github.com/gregghy/parshred/blob/main/docs"
Issues = "https://github.com/gregghy/parshred/issues"

[tool.scikit-build]
cmake.args = ["-DPARSHRED_BUILD_PYTHON=ON", "-DPARSHRED_BUILD_TESTS=OFF", "-DPARSHRED_BUILD_BENCH=OFF", "-DPARSHRED_BUILD_CLI=OFF"]
wheel.install-dir = "."
