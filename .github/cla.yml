# CLA Assistant configuration.
# Docs: https://github.com/cla-assistant/cla-assistant
# This file is consumed by the CLA Assistant GitHub App when installed on
# the parshred/parshred repository.

# The CLA text users see and agree to. Hosted in-repo so the version they
# sign is the version we ship.
url: https://github.com/parshred/parshred/blob/main/docs/cla/CLA-INDIVIDUAL.md

# Require a CLA signature on every pull request, including drafts.
# (Set to false to allow draft PRs without a CLA.)
allowDraftPRs: false

# Auto-update the stored CLA when the file above changes. If a contributor
# signed an older version, CLA Assistant will ask them to re-sign only if
# the new version is materially different (it diffs the text).
updateAccessLevel: "admin"

# Re-check signatures on every push to an open PR (not just on PR open).
alwaysRequireSigned: true
